name: Build Portal Arena (J2ME)
on: [push, workflow_dispatch]

jobs:
  build-j2me:
    name: Build J2ME MIDlet
    runs-on: ubuntu-latest
    container: eclipse-temurin:8-jdk
    steps:
      - uses: actions/checkout@v4
      - name: Download J2ME API stubs
        run: |
          mkdir -p j2me/lib
          wget -q -O j2me/lib/midpapi20.jar https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar
          wget -q -O j2me/lib/cldcapi11.jar https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar
          wget -q -O j2me/lib/bluecove.jar https://repo1.maven.org/maven2/net/sf/bluecove/bluecove/2.1.0/bluecove-2.1.0.jar
      - name: Compile MIDlet
        run: |
          mkdir -p j2me/build/classes
          javac -source 1.3 -target 1.3 -encoding UTF-8 \
            -bootclasspath j2me/lib/cldcapi11.jar:j2me/lib/midpapi20.jar:j2me/lib/bluecove.jar \
            -d j2me/build/classes $(find j2me/src -name '*.java')
      - name: Preverify with ProGuard
        run: |
          apt-get update -qq && apt-get install -y -qq unzip
          mkdir -p j2me/lib/pg
          wget -q -O j2me/lib/pg/proguard.zip https://github.com/Guardsquare/proguard/releases/download/v7.3.2/proguard-7.3.2.zip
          unzip -q -d j2me/lib/pg j2me/lib/pg/proguard.zip
          echo "-injars j2me/build/classes" > proguard.cfg
          echo "-outjars j2me/build/preverified" >> proguard.cfg
          echo "-libraryjars j2me/lib/cldcapi11.jar" >> proguard.cfg
          echo "-libraryjars j2me/lib/midpapi20.jar" >> proguard.cfg
          echo "-dontwarn javax.bluetooth.**" >> proguard.cfg
          echo "-microedition" >> proguard.cfg
          echo "-dontobfuscate" >> proguard.cfg
          echo "-dontoptimize" >> proguard.cfg
          echo "-dontshrink" >> proguard.cfg
          java -jar j2me/lib/pg/proguard-7.3.2/lib/proguard.jar @proguard.cfg
          echo "--- Bytecode version check ---"
          javap -verbose j2me/build/preverified/pa/PA.class | grep "major version" || true
      - name: Package JAR + JAD
        run: |
          echo "Manifest-Version: 1.0" > j2me/manifest.txt
          echo "MIDlet-Name: PortalArena" >> j2me/manifest.txt
          echo "MIDlet-Version: 1.0" >> j2me/manifest.txt
          echo "MIDlet-Vendor: andrewrush" >> j2me/manifest.txt
          echo "MIDlet-1: PortalArena,,pa.PA" >> j2me/manifest.txt
          echo "MicroEdition-Profile: MIDP-2.0" >> j2me/manifest.txt
          echo "MicroEdition-Configuration: CLDC-1.1" >> j2me/manifest.txt
          echo "MIDlet-Permissions: javax.microedition.io.Connector.bluetooth" >> j2me/manifest.txt
          jar cfm j2me/PortalArena.jar j2me/manifest.txt -C j2me/build/preverified .
          JAR_SIZE=$(stat -c%s j2me/PortalArena.jar)
          printf "MIDlet-Name: PortalArena\nMIDlet-Version: 1.0\nMIDlet-Vendor: andrewrush\nMIDlet-1: PortalArena,,pa.PA\nMIDlet-Jar-URL: PortalArena.jar\nMIDlet-Jar-Size: %s\nMIDlet-Permissions: javax.microedition.io.Connector.bluetooth\n" "$JAR_SIZE" > j2me/PortalArena.jad
      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            j2me/PortalArena.jar
            j2me/PortalArena.jad
