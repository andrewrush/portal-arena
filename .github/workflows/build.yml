name: build-j2me

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download compile-only API libraries
        run: |
          mkdir -p libs
          curl -fSL -o libs/microemu.jar https://repo1.maven.org/maven2/org/microemu/microemulator/2.0.4/microemulator-2.0.4.jar
          curl -fSL -o libs/bluecove.jar https://repo1.maven.org/maven2/net/sf/bluecove/bluecove/2.1.0/bluecove-2.1.0.jar

      - name: Compile (Java 1.3 classfiles for KVM)
        run: |
          mkdir -p build/classes
          javac -source 1.3 -target 1.3 -encoding UTF-8 \
            -bootclasspath "libs/microemu.jar:libs/bluecove.jar:$JAVA_HOME/jre/lib/rt.jar" \
            -d build/classes $(find j2me/src -name '*.java')

      - name: Manifest
        run: |
          mkdir -p build/classes/META-INF
          printf '%s\n' \
            'Manifest-Version: 1.0' \
            'MIDlet-1: PortalArena,,pa.PA' \
            'MIDlet-Name: PortalArena' \
            'MIDlet-Vendor: andrewrush' \
            'MIDlet-Version: 1.0' \
            'MicroEdition-Configuration: CLDC-1.1' \
            'MicroEdition-Profile: MIDP-2.0' \
            'MIDlet-Permissions: javax.microedition.io.Connector.bluetooth.clie' \
            ' nt,javax.microedition.io.Connector.bluetooth.server' \
            > build/classes/META-INF/MANIFEST.MF

      - name: ProGuard preverify (microedition)
        run: |
          curl -fSL -o proguard.tar.gz https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.tar.gz
          tar xzf proguard.tar.gz
          java -jar proguard-7.4.2/lib/proguard.jar @proguard.cfg

      - name: Generate JAD
        run: |
          SHA=$(sha1sum build/PortalArena.jar | cut -d' ' -f1 | tr 'a-f' 'A-F')
          SIZE=$(stat -c %s build/PortalArena.jar)
          printf '%s\n' \
            'MIDlet-1: PortalArena,,pa.PA' \
            'MIDlet-Name: PortalArena' \
            'MIDlet-Vendor: andrewrush' \
            'MIDlet-Version: 1.0' \
            'MicroEdition-Configuration: CLDC-1.1' \
            'MicroEdition-Profile: MIDP-2.0' \
            "MIDlet-Jar-Size: $SIZE" \
            'MIDlet-Jar-URL: PortalArena.jar' \
            "MIDlet-Jar-SHA-1: $SHA" \
            'MIDlet-Permissions: javax.microedition.io.Connector.bluetooth.clie' \
            ' nt,javax.microedition.io.Connector.bluetooth.server' \
            > build/PortalArena.jad
          cat build/PortalArena.jad

      - uses: actions/upload-artifact@v4
        with:
          name: j2me-midlet
          path: |
            build/PortalArena.jar
            build/PortalArena.jad
